<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing Panel</title>
<style>
  :root {
    --bg-top: #0b1220;
    --bg-bottom: #1b2a4a;
    --card-bg: rgba(255,255,255,0.06);
    --text: #e8eefc;
    --muted: #9fb0d0;
    --accent: #5fd3c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 20px 24px 24px;
    backdrop-filter: blur(6px);
    position: relative;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .title { font-size: 20px; font-weight: 700; margin: 0; }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .status {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .dot.playing { background: #4ade80; box-shadow: 0 0 8px #4ade8099; }

  /* Brightness control, top-right corner of the card */
  .brightness-box {
    position: absolute;
    top: 16px;
    right: 20px;
    width: 110px;
    text-align: right;
  }
  .brightness-label {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .brightness-label span.level { color: var(--accent); font-weight: 700; }
  .brightness-box input[type=range] {
    width: 100%;
    accent-color: var(--accent);
  }

  .art-box {
    margin-top: 18px;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: #060a14;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .art-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .no-signal { color: var(--muted); font-size: 14px; }

  .track-info { margin-top: 18px; }
  .track-name { font-size: 18px; font-weight: 700; }
  .artist-name { color: var(--muted); font-size: 14px; margin-top: 2px; }

  .footer {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }
  .footer code { color: #cfe6ff; }
</style>
</head>
<body>

<div class="card">
  <div class="brightness-box">
    <div class="brightness-label">
      <span>Brightness</span>
      <span class="level" id="brightnessValue">--</span>
    </div>
    <input type="range" id="brightnessSlider" min="0" max="255" value="180">
  </div>

  <div class="header">
    <div>
      <p class="title">Now Playing Panel</p>
      <p class="subtitle">P6-3535(27)-8S-HL &middot; 32&times;32 &middot; ESP32</p>
    </div>
  </div>
  <div class="status" style="margin-top:6px;">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">paused</span>
  </div>

  <div class="art-box" id="artBox">
    <span class="no-signal">no signal</span>
  </div>

  <div class="track-info">
    <div class="track-name" id="trackName">&mdash;</div>
    <div class="artist-name" id="artistName">&nbsp;</div>
  </div>

  <div class="footer">
    <div>Source: Last.fm scrobbles &middot; artwork via iTunes</div>
    <div>ESP32 frame endpoint: <code>/api/frame</code> (32&times;32 RGB565, big-endian)</div>
  </div>
</div>

<script>
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const artBox = document.getElementById('artBox');
const trackNameEl = document.getElementById('trackName');
const artistNameEl = document.getElementById('artistName');
const brightnessSlider = document.getElementById('brightnessSlider');
const brightnessValue = document.getElementById('brightnessValue');

let lastArtUrl = null;
let draggingBrightness = false;

async function refreshNowPlaying() {
  const res = await fetch('/api/nowplaying');
  const data = await res.json();

  const playing = !!data.isPlaying;
  statusDot.classList.toggle('playing', playing);
  statusText.textContent = playing ? 'playing' : 'paused';

  trackNameEl.textContent = data.trackName || '\u2014';
  artistNameEl.textContent = data.artistName || '\u00a0';

  if (data.albumArtUrl && data.albumArtUrl !== lastArtUrl) {
    artBox.innerHTML = `<img src="${data.albumArtUrl}" alt="album art">`;
    lastArtUrl = data.albumArtUrl;
  } else if (!data.albumArtUrl) {
    artBox.innerHTML = '<span class="no-signal">no signal</span>';
    lastArtUrl = null;
  }
}

async function refreshBrightness() {
  if (draggingBrightness) return;
  const res = await fetch('/api/brightness');
  const data = await res.json();
  brightnessSlider.value = data.brightness;
  brightnessValue.textContent = data.brightness;
}

brightnessSlider.addEventListener('pointerdown', () => { draggingBrightness = true; });
brightnessSlider.addEventListener('input', () => {
  brightnessValue.textContent = brightnessSlider.value;
});
brightnessSlider.addEventListener('change', async () => {
  await fetch('/api/brightness', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ brightness: parseInt(brightnessSlider.value, 10) }),
  });
  draggingBrightness = false;
});

refreshNowPlaying();
refreshBrightness();
setInterval(refreshNowPlaying, 3000);
setInterval(refreshBrightness, 5000);
</script>
</body>
</html>
